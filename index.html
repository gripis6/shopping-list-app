<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 리스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      padding: 32px 28px;
      height: fit-content;
    }

    h1 {
      font-size: 1.6rem;
      color: #1a202c;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus { border-color: #667eea; }

    .input-row button {
      padding: 12px 20px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .input-row button:hover { background: #5a67d8; }
    .input-row button:disabled { background: #a0aec0; cursor: not-allowed; }

    .summary {
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 12px;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: #f7fafc;
      transition: background 0.2s;
    }

    li:hover { background: #edf2f7; }

    li.checked { background: #f0fff4; }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #48bb78;
      cursor: pointer;
      flex-shrink: 0;
    }

    li .name {
      flex: 1;
      font-size: 1rem;
      color: #2d3748;
      word-break: break-all;
    }

    li.checked .name {
      text-decoration: line-through;
      color: #a0aec0;
    }

    li .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #cbd5e0;
      font-size: 1.1rem;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      line-height: 1;
    }

    li .delete-btn:hover { color: #fc8181; background: #fff5f5; }

    .empty {
      text-align: center;
      color: #a0aec0;
      padding: 32px 0;
      font-size: 0.95rem;
    }

    .clear-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background: none;
      border: 2px solid #fed7d7;
      color: #fc8181;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .clear-btn:hover { background: #fff5f5; }

    .status {
      font-size: 0.78rem;
      color: #a0aec0;
      text-align: right;
      margin-bottom: 8px;
      min-height: 1em;
    }

    .status.error { color: #fc8181; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛒 쇼핑 리스트</h1>
    <div class="input-row">
      <input type="text" id="itemInput" placeholder="아이템 입력..." maxlength="60">
      <button id="addBtn" onclick="addItem()">추가</button>
    </div>
    <div class="status" id="status"></div>
    <div class="summary" id="summary"></div>
    <ul id="list"></ul>
    <div class="empty" id="empty">아이템을 추가해 보세요!</div>
    <button class="clear-btn" id="clearBtn" onclick="clearChecked()" style="display:none">
      완료된 항목 삭제
    </button>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://yeatrshvfgoasiedmyme.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InllYXRyc2h2ZmdvYXNpZWRteW1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMzEwMzUsImV4cCI6MjA4OTgwNzAzNX0.SqEfoYK8a3CQPBNLXjFvK1WBUm01Zg1syJ-cY2JGP_0';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let items = [];

    const input = document.getElementById('itemInput');
    const addBtn = document.getElementById('addBtn');
    const statusEl = document.getElementById('status');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (isError ? ' error' : '');
    }

    function setLoading(loading) {
      addBtn.disabled = loading;
      input.disabled = loading;
    }

    function render() {
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      const clearBtn = document.getElementById('clearBtn');
      const summary = document.getElementById('summary');

      list.innerHTML = '';

      if (items.length === 0) {
        empty.style.display = 'block';
        clearBtn.style.display = 'none';
        summary.textContent = '';
        return;
      }

      empty.style.display = 'none';
      const checkedCount = items.filter(i => i.checked).length;
      summary.textContent = `${items.length}개 중 ${checkedCount}개 완료`;
      clearBtn.style.display = checkedCount > 0 ? 'block' : 'none';

      items.forEach(item => {
        const li = document.createElement('li');
        if (item.checked) li.classList.add('checked');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = item.checked;
        cb.onchange = () => toggleItem(item.id, cb.checked);

        const span = document.createElement('span');
        span.className = 'name';
        span.textContent = item.name;

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '✕';
        del.title = '삭제';
        del.onclick = () => deleteItem(item.id);

        li.append(cb, span, del);
        list.appendChild(li);
      });
    }

    async function loadItems() {
      setStatus('불러오는 중...');
      const { data, error } = await supabase
        .from('shopping_items')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) {
        setStatus('데이터 로드 실패: ' + error.message, true);
        return;
      }

      items = data;
      setStatus('');
      render();
    }

    window.addItem = async function() {
      const name = input.value.trim();
      if (!name) return;

      setLoading(true);
      setStatus('추가 중...');

      const { data, error } = await supabase
        .from('shopping_items')
        .insert([{ name, checked: false }])
        .select()
        .single();

      setLoading(false);

      if (error) {
        setStatus('추가 실패: ' + error.message, true);
        return;
      }

      items.push(data);
      input.value = '';
      setStatus('');
      render();
      input.focus();
    };

    async function toggleItem(id, checked) {
      const { error } = await supabase
        .from('shopping_items')
        .update({ checked })
        .eq('id', id);

      if (error) {
        setStatus('업데이트 실패: ' + error.message, true);
        await loadItems();
        return;
      }

      const item = items.find(i => i.id === id);
      if (item) item.checked = checked;
      render();
    }

    async function deleteItem(id) {
      const { error } = await supabase
        .from('shopping_items')
        .delete()
        .eq('id', id);

      if (error) {
        setStatus('삭제 실패: ' + error.message, true);
        return;
      }

      items = items.filter(i => i.id !== id);
      render();
    }

    window.clearChecked = async function() {
      const checkedIds = items.filter(i => i.checked).map(i => i.id);
      if (checkedIds.length === 0) return;

      setStatus('삭제 중...');

      const { error } = await supabase
        .from('shopping_items')
        .delete()
        .in('id', checkedIds);

      if (error) {
        setStatus('삭제 실패: ' + error.message, true);
        return;
      }

      items = items.filter(i => !i.checked);
      setStatus('');
      render();
    };

    loadItems();
  </script>
</body>
</html>
